[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lhfm-i"
version = "0.1.0"
description = "LHFM-I: Lagrangian-Hamiltonian Flow Matching for image generation"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
